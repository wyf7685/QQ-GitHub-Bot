version: "3"
services:
  redis:
    image: redis:7-alpine
    environment:
      - TZ=Asia/Shanghai
      - REDIS_PASSWORD=${REDIS_PASSWORD:?err}
    command: ["sh", "-c", "redis-server --requirepass $$REDIS_PASSWORD"]
    volumes:
      - bot_redis_data:/data
    restart: always

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?err}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?err}
      - POSTGRES_DB=${POSTGRES_DB:?err}
      - POSTGRES_INITDB_ARGS="--encoding=UTF8"
      - TZ=Asia/Shanghai
    volumes:
      - bot_postgres_data:/var/lib/postgresql/data
    restart: always

  playwright:
    image: mcr.microsoft.com/playwright:v1.62.0-noble
    init: true
    ipc: host
    user: pwuser
    working_dir: /home/pwuser
    command:
      - /bin/sh
      - -c
      - exec npx -y playwright@1.62.0 run-server --port 3000 --host 0.0.0.0
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const net=require('net');const socket=net.connect(3000,'127.0.0.1',()=>socket.end());socket.on('error',()=>process.exit(1));"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M
    restart: always

  nonebot:
    image: cscs181/qq-github-bot:latest # docker hub
    # image: ghcr.io/cscs181/qq-github-bot:latest # github image mirror
    # build: . # use "build" instead of "image" if you want to build the image yourself
    env_file:
      - .env
    environment:
      - ENVIRONMENT=prod
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8086}
      - PLAYWRIGHT_WS_ENDPOINT=ws://playwright:3000/
      - MAX_WORKERS=1 # maximum workers
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_started
      playwright:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-8086}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always

  go-cqhttp:
    image: ghcr.io/mrs4s/go-cqhttp:latest
    volumes:
      - "./bot:/data"
    depends_on:
      - nonebot
    restart: always
    profiles:
      - go-cqhttp
volumes:
  bot_redis_data: {}
  bot_postgres_data: {}
