name: Setup Python
description: Setup Python

inputs:
  python-version:
    description: Python version
    required: false
    default: "3.11"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
        architecture: "x64"

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync --locked
      shell: bash

    - name: Add project environment to PATH
      run: echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"
      shell: bash
