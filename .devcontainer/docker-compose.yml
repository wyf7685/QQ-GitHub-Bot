version: "3.8"

services:
  app:
    image: mcr.microsoft.com/devcontainers/python:3.11-bookworm

    volumes:
      - ../..:/workspaces:cached

    environment:
      TZ: Asia/Shanghai

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # Runs app on the same network as the database container, allows "forwardPorts" in devcontainer.json function.
    network_mode: service:db

    # Uncomment the next line to use a non-root user for all processes.
    # user: vscode

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      playwright:
        condition: service_healthy

  db:
    image: postgres:alpine
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: bot
      POSTGRES_DB: bot
      POSTGRES_PASSWORD: bot_postgres
      TZ: Asia/Shanghai

    # Add "forwardPorts": ["5432"] to **devcontainer.json** to forward PostgreSQL locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

  redis:
    image: redis:alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: bot_redis
      TZ: Asia/Shanghai
    command: ["sh", "-c", "redis-server --requirepass $$REDIS_PASSWORD"]

    # Runs app on the same network as the database container, allows "forwardPorts" in devcontainer.json function.
    network_mode: service:db

    # Add "forwardPorts": ["6379"] to **devcontainer.json** to forward PostgreSQL locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

  playwright:
    image: mcr.microsoft.com/playwright:v1.62.0-noble
    init: true
    ipc: host
    user: pwuser
    working_dir: /home/pwuser
    command:
      - /bin/sh
      - -c
      - exec npx -y playwright@1.62.0 run-server --port 3000 --host 0.0.0.0
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const net=require('net');const socket=net.connect(3000,'127.0.0.1',()=>socket.end());socket.on('error',()=>process.exit(1));"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
