[project]
name = "qq-github-bot"
version = "3.0.4"
description = "GitHub Bot for QQ"
authors = [
  { name = "yanyongyu", email = "yyy@yyydl.top" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
  "Jinja2>=3.0.0,<4.0.0",
  "unidiff>=0.7.0,<0.8.0",
  "humanize>=4.0.0,<5.0.0",
  "asyncpg>=0.29.0,<0.30.0",
  "playwright>=1.17.2,<2.0.0",
  "mdit-py-emoji>=0.1.0,<0.2.0",
  "nonebot-plugin-orm>=0.7.0,<0.8.0",
  "nonebot-adapter-qq>=1.4.2,<2.0.0",
  "nonebot-plugin-sentry>=2.0.0,<3.0.0",
  "nonebot-plugin-status>=0.9.0,<0.10.0",
  "nonebot-adapter-github>=0.4.0,<0.5.0",
  "nonebot-adapter-onebot>=2.4.2,<3.0.0",
  "nonebot-adapter-milky>=1.2.0,<2.0.0",
  "nonebot-plugin-uninfo>=0.11.2,<0.12.0",
  "nonebot-plugin-alconna>=0.62.1,<0.63.0",
  # pydantic 2.9.0 handle the namedtuple type incorrectly
  # https://github.com/pydantic/pydantic/issues/10336
  "pydantic>=2.6.3,<3.0.0,!=2.9.0",
  "redis[hiredis]>=5.0.0,<6.0.0",
  "markdown-it-py[linkify,plugins]>=3.0.0,<4.0.0",
  "nonebot2[httpx,websockets,fastapi]>=2.5.0,<3.0.0",
]

[dependency-groups]
dev = [
  "ruff>=0.16.5",
  "isort>=5.9.3,<6.0.0",
  "black>=24.0.0,<25.0.0",
  "nonemoji>=0.1.2,<0.2.0",
  "pre-commit>=3.1.0,<4.0.0",
]
deploy = [
  "gunicorn>=23.0.0,<24.0.0",
  "uvicorn>=0.18.3,<1.0.0",
]

[tool.poetry]
package-mode = false
requires-poetry = ">=2.3"

[tool.black]
preview = true
target-version = ["py311", "py312"]
line-length = 88
extend-exclude = '''
'''

[tool.isort]
profile = "black"
line_length = 88
length_sort = true
skip_gitignore = true
force_sort_within_sections = true
extra_standard_library = "typing_extensions"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
  "F",     # Pyflakes
  "W",     # pycodestyle warnings
  "E",     # pycodestyle errors
  "UP",    # pyupgrade
  "ASYNC", # flake8-async
  "C4",    # flake8-comprehensions
  "T10",   # flake8-debugger
  "T20",   # flake8-print
  "PYI",   # flake8-pyi
  "PT",    # flake8-pytest-style
  "Q",     # flake8-quotes
  "RUF",   # Ruff-specific rules
]
ignore = [
  "E402",   # module-import-not-at-top-of-file
  "UP037",  # quoted-annotation
  "RUF001", # ambiguous-unicode-character-string
  "RUF002", # ambiguous-unicode-character-docstring
  "RUF003", # ambiguous-unicode-character-comment
]

[tool.ruff.lint.extend-per-file-ignores]
"./scripts/*" = ["T201", "ASYNC240"]
"./docker/*" = ["T201"]

[tool.pyright]
extraPaths = ["./"]

pythonPlatform = "All"
pythonVersion = "3.11"

typeCheckingMode = "standard"
reportShadowedImports = false
disableBytesTypePromotions = true
reportIncompatibleVariableOverride = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
